services:
  course:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        STUDENT_UID: ${STUDENT_UID:-1000}
        STUDENT_GID: ${STUDENT_GID:-1000}
    image: modern-cryptography-2026
    working_dir: /workspace
    user: student
    volumes:
      - ..:/workspace
    ports:
      - "8888:8888"
    networks:
      - default
      - lab01-ssh-internal
      - lab02-internal
      - lab03-internal
    stdin_open: true
    tty: true

  lab01-ssh-target:
    profiles:
      - lab01-ssh
    build:
      context: ..
      dockerfile: docker/lab01-ssh-target/Dockerfile
    image: modern-cryptography-2026-lab01-ssh-target
    hostname: lab01-ssh-target
    expose:
      - "22"
    networks:
      - lab01-ssh-internal
    read_only: true
    tmpfs:
      - /run
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "ssh-keyscan -T 1 127.0.0.1 >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 10

  lab02-target:
    profiles:
      - lab02
    # Staff build docker/lab02-target/Dockerfile with the private server source.
    # Compose pulls this release from GHCR; students do not build the target.
    image: ghcr.io/wonsuk-emsec/modern-cryptography-2026-lab02-target:2026-lab02-v1
    hostname: lab02-target
    expose:
      - "8080"
    networks:
      - lab02-internal
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 8080), 1).close()"]
      interval: 2s
      timeout: 2s
      retries: 10

  lab03-target:
    profiles:
      - lab03
    # Staff build and validate this version before publishing it to GHCR.
    # Runtime practice keys are distinct from instructor-hosted grading keys.
    image: ghcr.io/wonsuk-emsec/modern-cryptography-2026-lab03-target:2026-lab03-v1
    hostname: lab03-target
    expose:
      - "8080"
    networks:
      - lab03-internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s

networks:
  lab01-ssh-internal:
    internal: true
  lab02-internal:
    internal: true
  lab03-internal:
    internal: true
