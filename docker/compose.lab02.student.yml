# Legacy entry point for older Lab02 handouts. New sessions use compose.yml
# and its shared course service; see docker/README.md. Finish an old session
# before switching files. Retained so existing handout commands still work.
services:
  lab02-course:
    image: modern-cryptography-2026
    pull_policy: never
    working_dir: /workspace/labs/lab02
    user: student
    volumes:
      - ../labs/lab02:/workspace/labs/lab02
    networks:
      - lab02-internal
    stdin_open: true
    tty: true

  lab02-target:
    profiles:
      - lab02
    image: modern-cryptography-2026-lab02-target
    pull_policy: never
    hostname: lab02-target
    expose:
      - "8080"
    networks:
      - lab02-internal
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 8080), 1).close()"]
      interval: 2s
      timeout: 2s
      retries: 10

networks:
  lab02-internal:
    internal: true
